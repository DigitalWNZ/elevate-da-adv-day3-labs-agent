kind: source
name: operations-db
type: bigtable
project: ${PROJECT_ID}
instance: ${BIGTABLE_INSTANCE:-operations-db}
---
kind: tool
name: read_cashier_realtime_alerts_sql
type: bigtable-sql
source: operations-db
description: Query live 1-hour rolling metrics, manual override rates, promo usage, and audit status flags for a cashier from Cloud Bigtable table cashier_realtime_alerts by row key prefix (e.g. STORE_048#CASH_1190).
parameters:
  - name: row_key_prefix
    type: string
    description: Row key prefix formatted as STORE_<store_id_3digits>#CASH_<cashier_id_4digits>, e.g. STORE_048#CASH_1190
statement: |
  SELECT
    CAST(_key AS STRING) AS row_key,
    CAST(flags['audit_status'] AS string) AS audit_status,
    CAST(stats['last_event_ts'] AS string) AS last_event_ts,
    TO_FLOAT64(stats['cashier_1h_avg_discount_pct']) AS avg_discount_pct,
    TO_INT64(stats['cashier_1h_manual_override_count']) AS manual_override_count,
    TO_INT64(stats['cashier_1h_promo_count']) AS promo_count,
    TO_FLOAT64(stats['cashier_1h_promo_rate']) AS promo_rate,
    TO_FLOAT64(stats['cashier_1h_total_discount_usd']) AS total_discount_usd,
    TO_INT64(stats['cashier_1h_txn_count']) AS txn_count,
    TO_FLOAT64(stats['risk_score']) AS risk_score
  FROM cashier_realtime_alerts
  WHERE CAST(_key AS STRING) LIKE CONCAT(@row_key_prefix, '%')
  ORDER BY CAST(_key AS STRING) DESC
  LIMIT 5;
---
kind: tool
name: read_pos_transactions_enriched_sql
type: bigtable-sql
source: operations-db
description: Query enriched real-time POS transaction details from Cloud Bigtable table pos_transactions_enriched by row key prefix (e.g. STORE_001#TXN-).
parameters:
  - name: row_key_prefix
    type: string
    description: Row key prefix formatted as STORE_<store_id_3digits>#TXN- or transaction identifier, e.g. STORE_001#TXN-20260910-0003385
statement: |
  SELECT
    CAST(_key AS STRING) AS row_key,
    CAST(tx['transaction_id'] AS STRING) AS transaction_id,
    CAST(tx['store_id'] AS STRING) AS store_id,
    CAST(tx['pos_terminal_id'] AS STRING) AS pos_terminal_id,
    CAST(tx['cashier_id'] AS STRING) AS cashier_id,
    CAST(tx['customer_id'] AS STRING) AS customer_id,
    CAST(tx['business_date'] AS STRING) AS business_date,
    CAST(tx['event_timestamp'] AS STRING) AS event_timestamp,
    TO_FLOAT64(tx['total']) AS total,
    TO_FLOAT64(tx['subtotal_amount']) AS subtotal_amount,
    TO_FLOAT64(tx['discount']) AS discount,
    CAST(tx['payment_method'] AS STRING) AS payment_method,
    CAST(tx['promo_code_applied'] AS STRING) AS promo_code_applied,
    TO_INT64(tx['total_quantity']) AS total_quantity
  FROM pos_transactions_enriched
  WHERE CAST(_key AS STRING) LIKE CONCAT(@row_key_prefix, '%')
  ORDER BY CAST(_key AS STRING) DESC
  LIMIT 10;
