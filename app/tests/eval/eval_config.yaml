# Evaluation configuration for Cymbal Retail Operations Portal
metrics_to_run:
  - tool_use_quality
  - grounding
  - custom_response_quality
  - agent_turn_count
  - token_budget_compliance

thresholds:
  tool_use_quality: 0.85
  grounding: 0.80
  custom_response_quality: 4.0
  overall_quality_gate: 4.0
  token_budget_compliance: 1.0

custom_metrics:
  # Local LLM-as-judge scoring response quality and groundedness
  - name: custom_response_quality
    custom_function_file: response_quality.py
  - name: agent_turn_count
    custom_function: |
      def evaluate(instance):
          turns = (instance.get("agent_data") or {}).get("turns", [])
          if not turns:
              return {'score': 1}
          events = turns[0].get("events", []) if isinstance(turns[0], dict) else []
          user_events = [e for e in events if (isinstance(e, dict) and e.get("author") == "user")]
          return {'score': max(len(user_events), len(turns))}
  - name: token_budget_compliance
    custom_function: |
      def evaluate(instance):
          turns = (instance.get("agent_data") or {}).get("turns", [])
          total_chars = 0
          for t in turns:
              if isinstance(t, dict):
                  for ev in t.get("events", []):
                      if isinstance(ev, dict):
                          c = ev.get("content") or {}
                          for p in c.get("parts", []):
                              if isinstance(p, dict) and "text" in p:
                                  total_chars += len(p["text"])
          approx_tokens = int(total_chars / 4)
          return {'score': 1.0 if approx_tokens <= 2000 else 0.0}
